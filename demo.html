      '<button class="btn btn-sec" data-csv>' + icon('download', 15) + 'Export CSV</button>') +
    '<div class="grid g-3" style="margin-bottom:16px">' +
      statCard('Total (' + MONTHLY.months + ' months)', money(total)) +
      statCard('Monthly average', money(rows.length ? total / rows.length : 0)) +
      statCard('Unpaid across period', money(unpaid), { tone: 'warn' }) + '</div>' +
    '<div class="grid g-3" style="margin-bottom:16px">' +
      card('Daily vs recurring', 'Split of monthly spend', groupedBars(bars, ['recurring','daily'], [C.navy, C.gold], ['Recurring','Daily']), { cls: 'span2' }) +
      card('Category breakdown', active ? active.label : 'Select a month', donut(pie)) +
    '</div>' + table(cols, rows, { id: 'monthly', emptyTitle: 'No monthly data yet', emptyMessage: 'Once expenses are recorded they roll up here automatically.' });

  return { html, mount: (root) => {
    root.querySelector('[data-months]').onchange = (e) => { MONTHLY.months = Number(e.target.value); render(); };
    root.querySelectorAll('[data-sel]').forEach((b) => (b.onclick = () => { MONTHLY.selected = b.dataset.sel; render(); }));
    root.querySelector('[data-csv]').onclick = () => exportCsv('voxpact-monthly-' + today() + '.csv',
      [{ label:'Month', value:(r) => r.label }, { label:'Entries', value:(r) => r.count }, { label:'Daily', value:(r) => r.daily.toFixed(2) },
       { label:'Recurring', value:(r) => r.recurring.toFixed(2) }, { label:'Unpaid', value:(r) => r.pending.toFixed(2) },
       { label:'Total', value:(r) => r.total.toFixed(2) }], rows);
  } };
}

    '</div>' +
    '<div class="grid g-2">' +
      field('amount', 'Amount', { type: 'number', step: '0.01', min: 0, required: true, value: row ? row.amount : '', placeholder: '0.00' }) +
      field('projectedDate', 'Expected date', { type: 'date', required: true, value: row ? iso(row.projectedDate) : today() }) +
    '</div>' +
    field('status', 'Status', { type: 'select', value: row ? row.status : 'PROJECTED',
      options: [{ value: 'PROJECTED', label: 'Projected — not received yet' }, { value: 'RECEIVED', label: 'Received' }] }) +

      field('receivedAmount', 'Received amount', { type: 'number', step: '0.01', min: 0, value: row && row.receivedAmount != null ? row.receivedAmount : '', hint: 'Leave blank to use the full amount' }) +
    '</div>' +
    field('description', 'Notes', { type: 'textarea', value: row ? row.description || '' : '', placeholder: 'Invoice number, payment terms, context…' }) +
    '</form>';
  openModal({
    title: row ? 'Edit revenue' : 'New revenue entry',
    description: 'Track what you expect to invoice and what has actually landed.',
    body,
    footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-save>' + (row ? 'Save changes' : 'Add revenue') + '</button>',
    onMount: (scrim, close) => {
      const form = scrim.querySelector('#revForm');
      const sel = form.querySelector('[name=status]'), block = scrim.querySelector('#recvBlock');
      sel.onchange = () => block.classList.toggle('hide', sel.value !== 'RECEIVED');
      scrim.querySelector('[data-save]').onclick = async (e) => {
        const v = readForm(form);
        const errs = {};
        if (!v.clientName.trim()) errs.clientName = 'Who is this revenue from?';
        if (!(Number(v.amount) > 0)) errs.amount = 'Amount must be greater than zero';
        if (!v.projectedDate) errs.projectedDate = 'Pick the expected date';
        if (!showErrors(form, errs)) return;
        e.target.disabled = true;
        try {
          const received = v.status === 'RECEIVED';
          await Data.saveRevenue({
            clientName: v.clientName.trim(), source: v.source.trim() || null, description: v.description.trim() || null,
            amount: Number(v.amount), projectedDate: new Date(v.projectedDate).toISOString(), status: v.status,
            receivedDate: received ? new Date(v.receivedDate || today()).toISOString() : null,
            receivedAmount: received ? Number(v.receivedAmount || v.amount) : null,
          }, row && row.id);
          close(); toast(row ? 'Revenue updated' : 'Revenue recorded'); render();
        } catch (err) { e.target.disabled = false; toast('Could not save revenue', err.message, 'error'); }
      };
    },
  });
}

        '<button class="btn btn-ghost btn-ico dang" data-del="' + esc(r.id) + '" aria-label="Delete ' + esc(r.clientName) + '">' + icon('trash', 14) + '</button></div>'
      : '<span class="tiny sub">Read only</span>' },

      (writable ? '<button class="btn btn-primary" data-add>' + icon('plus', 15) + 'Add revenue</button>' : '')) +
    '<div class="grid g-4" style="margin-bottom:16px">' +
      statCard('Projected', money(t.projected)) +
      statCard('Received', money(t.received), { tone: 'pos' }) +
      statCard('Outstanding', money(t.outstanding), { tone: 'warn' }) +
      statCard('Projection accuracy', pct(t.accuracy), { tone: 'gold', bar: t.accuracy }) + '</div>' +

      };
    },
  });

/* ----------------------------------------------------------- daily budget */
const BUD = { date: today(), days: 30, draft: null, applyDefault: false };
async function pageBudget() {
  const snap = await Data.budgetDay(BUD.date);
  const history = await Data.budgetHistory(BUD.days);
  const amount = BUD.draft !== null ? BUD.draft : snap.budgetAmount;
  const exceeded = snap.remaining < 0;
  const within = history.filter((h) => h.percentUsed <= 100).length;
  const breaches = history.filter((h) => h.percentUsed > 100).length;
  const COPY = { HEALTHY: 'Spending is comfortably within today’s limit.',
                 WARNING: 'You have used more than 70% of today’s budget.',
                 DANGER: 'Over 90% of today’s budget is gone.' };
  const tone = snap.status === 'DANGER' ? 'dang' : snap.status === 'WARNING' ? 'warn' : 'pos';

  const chart = (() => {
    if (!history.length) return noData(230);
    const w = 720, h = 230, pad = { l: 46, r: 12, t: 14, b: 30 };
    const max = niceMax(Math.max.apply(null, history.map((d) => Math.max(d.spent, d.budget)).concat([1])));
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    const step = iw / history.length, bw = Math.min(18, step - 4);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const gy = pad.t + (ih * i) / 4, val = max - (max * i) / 4;
      g += '<line x1="' + pad.l + '" y1="' + gy + '" x2="' + (w - pad.r) + '" y2="' + gy + '" stroke="' + C.grid + '" stroke-dasharray="3 3"/>' +
           '<text x="' + (pad.l - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="' + C.axis + '">' + short(val) + '</text>';
    }
    let bars = '', line = '';
    history.forEach((d, i) => {
      const cx = pad.l + step * i + step / 2;
      const bh = (d.spent / max) * ih;
      const col = d.budget > 0 && d.spent / d.budget > 1 ? C.dang : d.budget > 0 && d.spent / d.budget >= 0.7 ? C.warn : C.pos;
      bars += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (pad.t + ih - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="3" fill="' + col + '" opacity=".9"><title>' + esc(d.label) + ': ' + esc(money(d.spent)) + ' of ' + esc(money(d.budget)) + '</title></rect>';
      line += (i ? 'L' : 'M') + cx.toFixed(1) + ' ' + (pad.t + ih - (d.budget / max) * ih).toFixed(1) + ' ';
      if (i % Math.ceil(history.length / 10) === 0 || i === history.length - 1)
        bars += '<text x="' + cx.toFixed(1) + '" y="' + (h - 10) + '" text-anchor="middle" font-size="9.5" fill="' + C.axis + '">' + esc(d.label) + '</text>';
    });
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img" aria-label="Budget history">' + g + bars +
      '<path d="' + line + '" fill="none" stroke="' + C.gold + '" stroke-width="2" stroke-dasharray="4 3"/></svg>';
  })();

  const html = pageHead('Daily budget', 'A hard daily spending ceiling, tracked against real expense entries.') +
    '<div class="grid g-3">' +
      '<section class="glass anim span2"><div class="card-head"><div class="grow"><h3>Budget for ' + esc(fmtDate(BUD.date)) + '</h3>' +
        '<p class="xs mut" style="margin-top:3px">' + (snap.isDefault ? 'Using the default daily budget' : 'Custom budget set for this day') + '</p></div>' +
        '<span class="bdg dot b-' + tone + '">' + (snap.status === 'DANGER' ? 'Critical' : snap.status === 'WARNING' ? 'Watch it' : 'On track') + '</span></div>' +
        '<div class="card-body">' +
        '<div class="row wrap" style="justify-content:space-between;align-items:flex-end;gap:16px">' +
          '<div><p class="lbl">Spent</p><p class="num" style="font-size:27px;font-weight:800;margin-top:4px;color:rgb(' + (exceeded ? 'var(--dang)' : 'var(--ink)') + ')">' + esc(money(snap.spentAmount)) + '</p>' +
          '<p class="xs mut" style="margin-top:2px">of ' + esc(money(snap.budgetAmount)) + ' budgeted</p></div>' +
          '<div style="text-align:right"><p class="lbl">' + (exceeded ? 'Over budget by' : 'Remaining') + '</p>' +
          '<p class="num" style="font-size:27px;font-weight:800;margin-top:4px;color:rgb(' + (exceeded ? 'var(--dang)' : 'var(--pos)') + ')">' + esc(money(Math.abs(snap.remaining))) + '</p></div>' +
        '</div>' +
        '<div style="margin-top:18px">' + bar(snap.percentUsed, null) + '</div>' +
        '<div class="row" style="justify-content:space-between;margin-top:7px"><span class="tiny sub">0%</span>' +
          '<span class="tiny" style="color:rgb(var(--pos))">70%</span><span class="tiny" style="color:rgb(var(--warn))">90%</span>' +
          '<span class="tiny num" style="color:rgb(' + (snap.percentUsed > 100 ? 'var(--dang)' : 'var(--ink-subtle)') + ');font-weight:' + (snap.percentUsed > 100 ? '700' : '400') + '">' + snap.percentUsed.toFixed(0) + '%</span></div>' +
        '<div class="banner bn-' + tone + '" style="margin-top:16px">' + icon(snap.status === 'HEALTHY' ? 'checkCircle' : 'alert', 15) +
          '<div>' + (exceeded ? 'Daily budget exceeded by ' + esc(money(Math.abs(snap.remaining))) + '. Review today’s entries.' : COPY[snap.status]) + '</div></div>' +
        '</div></section>' +
      '<section class="glass anim"><div class="card-head"><div class="grow"><h3>Utilisation</h3>' +
        '<p class="xs mut" style="margin-top:3px">Live against today’s entries</p></div></div>' +
        '<div class="card-body" style="display:flex;flex-direction:column;align-items:center">' + gauge(snap.percentUsed, 180) +
        '<p class="num" style="font-size:26px;font-weight:800;margin-top:-30px">' + snap.percentUsed.toFixed(0) + '%</p>' +
        '<p class="xs mut">of budget used</p>' +
        '<div class="grid g-2" style="width:100%;margin-top:18px;padding-top:15px;border-top:1px solid rgb(var(--line))">' +
          '<div><p class="lbl">Days within budget</p><p class="num" style="font-size:17px;font-weight:700;color:rgb(var(--pos))">' + within + '</p></div>' +
          '<div><p class="lbl">Days over</p><p class="num" style="font-size:17px;font-weight:700;color:rgb(var(--dang))">' + breaches + '</p></div>' +
        '</div></div></section>' +
    '</div>' +
    (can('manage:budget') ?
      card('Set budget', 'Administrators only',
        '<div class="grid g-4">' +
          field('bdate', 'Date', { type: 'date', value: BUD.date }) +
          field('bamount', 'Budget amount', { type: 'number', step: '0.01', min: 0, value: amount }) +
          '<div style="display:flex;align-items:flex-end">' + toggleRow('applyDefault', 'Set as default', null, BUD.applyDefault) + '</div>' +
          '<div style="display:flex;align-items:flex-end"><button class="btn btn-primary" data-savebudget style="width:100%">' + icon('save', 15) + 'Save budget</button></div>' +
        '</div>', { cls: 'anim' }) : '') +
    '<div style="height:16px"></div>' +
    card('Budget history', 'Spending against budget, day by day', chart, {
      action: '<select data-days style="width:150px;height:32px;font-size:12px">' +
        [14, 30, 60, 90].map((d) => '<option value="' + d + '"' + (BUD.days === d ? ' selected' : '') + '>Last ' + d + ' days</option>').join('') + '</select>' });

  return { html, mount: (root) => {
    root.querySelector('[data-days]').onchange = (e) => { BUD.days = Number(e.target.value); render(); };
    const bd = root.querySelector('[name=bdate]');
    if (bd) bd.onchange = (e) => { BUD.date = e.target.value; BUD.draft = null; render(); };
    const ba = root.querySelector('[name=bamount]');
    if (ba) ba.oninput = () => { BUD.draft = ba.value; };
    const save = root.querySelector('[data-savebudget]');
    if (save) save.onclick = async (e) => {
      const applyDefault = root.querySelector('[data-toggle=applyDefault]').getAttribute('aria-checked') === 'true';
      e.target.disabled = true;
      try {
        await Data.setBudget(BUD.date, Number(ba.value || 0), applyDefault);
        BUD.draft = null; BUD.applyDefault = applyDefault;
        toast('Budget updated', applyDefault ? 'Also saved as the default daily budget.' : undefined);
        render();
      } catch (err) { e.target.disabled = false; toast('Could not save budget', err.message, 'error'); }
    };
  } };
}

/* ---------------------------------------------------------------- reports */
const REP = { tab: 'pnl', from: iso(startOfMonth(addMonths(new Date(), -5))), to: today() };
const REPORT_TABS = [
  { key: 'pnl', label: 'Profit & loss' },
  { key: 'expense-breakdown', label: 'Expense breakdown' },
  { key: 'revenue-trends', label: 'Revenue trends' },
  { key: 'partner-distribution', label: 'Partner distribution' },
  { key: 'employee-cost', label: 'Employee cost' },
];
async function reportData() {
  if (isApi()) return apiFetch('/reports/summary?from=' + REP.from + '&to=' + REP.to);
  const inR = (d) => d && iso(d) >= REP.from && iso(d) <= REP.to;
  const expenses = DB.expenses.filter((e) => inR(e.date));
  const revenues = DB.revenues.filter((r) => r.status === 'RECEIVED' && inR(r.receivedDate));
  const amt = (r) => Number(r.receivedAmount ?? r.amount);
  const revenue = round2(sum(revenues, amt)), expTotal = round2(sum(expenses, (e) => e.amount));

  const catMap = {}; expenses.forEach((e) => (catMap[e.category] = round2((catMap[e.category] || 0) + Number(e.amount))));
  const cliMap = {}; revenues.forEach((r) => (cliMap[r.clientName] = round2((cliMap[r.clientName] || 0) + amt(r))));
  const monthly = {};
  const touch = (d) => {
    const k = monthKey(d);
    if (!monthly[k]) monthly[k] = { month: k, label: monthLabel(d), revenue: 0, expenses: 0, profit: 0 };
    return monthly[k];
  };
  expenses.forEach((e) => (touch(e.date).expenses = round2(touch(e.date).expenses + Number(e.amount))));
  revenues.forEach((r) => (touch(r.receivedDate).revenue = round2(touch(r.receivedDate).revenue + amt(r))));
  Object.values(monthly).forEach((m) => (m.profit = round2(m.revenue - m.expenses)));

  const trend = {};
  DB.revenues.forEach((r) => {
    if (inR(r.projectedDate)) { const k = monthKey(r.projectedDate);
      trend[k] = trend[k] || { month: k, label: monthLabel(r.projectedDate), projected: 0, received: 0 };
      trend[k].projected = round2(trend[k].projected + Number(r.amount)); }
    if (r.receivedDate && inR(r.receivedDate)) { const k = monthKey(r.receivedDate);
      trend[k] = trend[k] || { month: k, label: monthLabel(r.receivedDate), projected: 0, received: 0 };
      trend[k].received = round2(trend[k].received + amt(r)); }
  });

  const netProfit = round2(revenue - expTotal);
  const activeEmp = DB.employees.filter((e) => e.isActive && !e.isSpecial);
  const projects = DB.projects.filter((p) => inR(p.date)).map((p) => {
    const e = DB.employees.find((x) => x.id === p.employeeId);
    return Object.assign({}, p, { employee: e ? e.name : 'Unknown' });
  });

  return {
    range: { from: REP.from, to: REP.to },
    summary: { revenue, expenses: expTotal, netProfit, margin: revenue > 0 ? Number(((netProfit / revenue) * 100).toFixed(1)) : 0,
      recurringExpenses: round2(sum(expenses.filter((e) => e.type === 'RECURRING'), (e) => e.amount)),
      dailyExpenses: round2(sum(expenses.filter((e) => e.type === 'DAILY'), (e) => e.amount)),
      transactionCount: expenses.length + revenues.length },
    expenseByCategory: Object.entries(catMap).map(([category, amount]) => ({ category, amount,
      share: expTotal > 0 ? Number(((amount / expTotal) * 100).toFixed(1)) : 0 })).sort((a, b) => b.amount - a.amount),
    revenueByClient: Object.entries(cliMap).map(([client, amount]) => ({ client, amount })).sort((a, b) => b.amount - a.amount),
    monthly: Object.values(monthly).sort((a, b) => (a.month > b.month ? 1 : -1)),
    revenueTrend: Object.values(trend).sort((a, b) => (a.month > b.month ? 1 : -1)),
    partnerDistribution: DB.partners.slice().sort((a, b) => b.percentage - a.percentage).map((p) => ({
      id: p.id, name: p.name, percentage: Number(p.percentage),
      shareAmount: round2((Math.max(0, netProfit) * Number(p.percentage)) / 100), paymentStatus: p.paymentStatus })),
    employeeCost: {
      rows: DB.employees.map((e) => ({ id: e.id, name: e.name, role: e.role, type: e.isSpecial ? 'Percentage-based' : 'Salaried',
        monthlySalary: Number(e.monthlySalary), bonus: Number(e.bonus),
        totalMonthlyCost: round2(Number(e.monthlySalary) + Number(e.bonus)), isActive: e.isActive })),
      totalMonthly: round2(sum(activeEmp, (e) => Number(e.monthlySalary) + Number(e.bonus))),
      specialPayouts: round2(sum(projects, (p) => p.payoutAmount)),
      specialProjects: projects },
    company: DB.settings.company, currency: DB.settings.currency,
  };
}

  const html = pageHead('Reports & analytics', 'Build a statement for any period, then export it as PDF or CSV.',
      '<button class="btn btn-sec" data-csv>' + icon('download', 15) + 'CSV</button>' +
      '<button class="btn btn-primary" data-pdf>' + icon('file', 15) + 'PDF</button>') +
    '<section class="glass anim" style="margin-bottom:16px;padding:18px"><div class="grid g-4">' +
      field('from', 'From', { type: 'date', value: REP.from }) + field('to', 'To', { type: 'date', value: REP.to }) +
      '<div class="span2" style="display:flex;align-items:flex-end"><div class="row wrap" style="gap:7px">' +
      presets.map((p, i) => '<button class="btn btn-sec btn-sm" data-preset="' + p[1] + '">' + esc(p[0]) + '</button>').join('') +
      '</div></div></div></section>' +
    '<div class="grid g-4" style="margin-bottom:16px">' +
      statCard('Revenue received', money(s.revenue), { tone: 'pos' }) +
      statCard('Total expenses', money(s.expenses)) +
      statCard('Net profit', money(s.netProfit), { tone: s.netProfit >= 0 ? 'pos' : 'dang' }) +
      statCard('Margin', pct(s.margin), { tone: 'gold' }) + '</div>' +
    tabs + bodyHtml;

  const pdfSections = () => {
    if (REP.tab === 'expense-breakdown') return [{ title: 'Expenses by category', head: ['Category','Amount','Share'], numeric: [1,2],
      body: d.expenseByCategory.map((r) => [r.category, money(r.amount), pct(r.share)]) }];
    if (REP.tab === 'revenue-trends') return [
      { title: 'Monthly revenue and expenses', head: ['Month','Revenue','Expenses','Profit'], numeric: [1,2,3],
        body: d.monthly.map((r) => [r.label, money(r.revenue), money(r.expenses), money(r.profit)]) },
      { title: 'Revenue by client', head: ['Client','Received'], numeric: [1],
        body: d.revenueByClient.map((r) => [r.client, money(r.amount)]) }];
    if (REP.tab === 'partner-distribution') return [{ title: 'Partner profit distribution', head: ['Partner','Percentage','Share','Status'], numeric: [1,2],
      body: d.partnerDistribution.map((r) => [r.name, pct(r.percentage, 2), money(r.shareAmount), r.paymentStatus]) }];
    if (REP.tab === 'employee-cost') return [
      { title: 'Employee cost', head: ['Employee','Role','Type','Salary','Bonus','Total','Status'], numeric: [3,4,5],
        body: d.employeeCost.rows.map((r) => [r.name, r.role, r.type, money(r.monthlySalary), money(r.bonus), money(r.totalMonthlyCost), r.isActive ? 'Active' : 'Inactive']) },
    ].concat(d.employeeCost.specialProjects.length ? [{ title: 'Percentage-based payouts', head: ['Employee','Project','Value','%','Payout','Date'], numeric: [2,3,4],
        body: d.employeeCost.specialProjects.map((p) => [p.employee, p.projectName, money(p.totalAmount), pct(p.percentage, 2), money(p.payoutAmount), fmtDate(p.date)]) }] : []);
    return [
      { title: 'Profit & loss statement', head: ['Line item','Amount'], numeric: [1], body: [
        ['Revenue received', money(s.revenue)], ['Daily expenses', money(s.dailyExpenses)],
        ['Recurring expenses', money(s.recurringExpenses)], ['Total expenses', money(s.expenses)],
        ['Net profit', money(s.netProfit)], ['Margin', pct(s.margin)] ] },
      { title: 'Month by month', head: ['Month','Revenue','Expenses','Profit'], numeric: [1,2,3],
        body: d.monthly.map((r) => [r.label, money(r.revenue), money(r.expenses), money(r.profit)]) },
    ];
  };

  return { html, mount: (root) => {
    root.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { REP.tab = b.dataset.tab; render(); }));
    root.querySelector('[name=from]').onchange = (e) => { REP.from = e.target.value; render(); };
    root.querySelector('[name=to]').onchange = (e) => { REP.to = e.target.value; render(); };
    root.querySelectorAll('[data-preset]').forEach((b) => (b.onclick = () => {
      const m = Number(b.dataset.preset);
      REP.from = iso(startOfMonth(addMonths(new Date(), -m))); REP.to = today(); render();
    }));
    root.querySelector('[data-pdf]').onclick = () => printReport(
      REPORT_TABS.find((t) => t.key === REP.tab).label + '  ·  ' + fmtDate(REP.from) + ' – ' + fmtDate(REP.to),
      pdfSections(),
      [{ label: 'Revenue', value: money(s.revenue) }, { label: 'Expenses', value: money(s.expenses) },
       { label: 'Net profit', value: money(s.netProfit) }, { label: 'Margin', value: pct(s.margin) }]);
    root.querySelector('[data-csv]').onclick = () => {
      const sec = pdfSections()[0];
      exportCsv('voxpact-' + REP.tab + '-' + REP.from + '_' + REP.to + '.csv',
        sec.head.map((h, i) => ({ label: h, value: (r) => r[i] })), sec.body);
    };
  } };
}

const USR = { search: '', role: 'ALL', status: 'ALL' };
function userModal(row, roles) {
  const body = '<form id="uForm" style="display:flex;flex-direction:column;gap:14px">' +
    (row ? '' : field('username', 'Username', { required: true, value: '', autocomplete: 'off' })) +
    '<div class="grid g-2">' +
      field('fullName', 'Full name', { value: row ? row.fullName || '' : '' }) +
      field('email', 'Email', { type: 'email', value: row ? row.email || '' : '' }) +
    '</div>' +
    field('role', 'Role', { type: 'select', value: row ? row.role : roles[0],
      options: roles.map((r) => ({ value: r, label: ROLE_LABEL[r] })),
      hint: 'Team Members can only add and edit their own expense entries.' }) +
    (row ? '' : field('password', 'Password', { type: 'password', required: true, autocomplete: 'new-password' }) + '<div id="upw">' + pwChecklist('') + '</div>') +
    toggleRow('mustChangePassword', 'Require password change at next sign-in', 'Recommended for accounts you create for someone else.', row ? !!row.mustChangePassword : true) +
    (row ? toggleRow('isActive', 'Account active', 'Deactivated accounts cannot sign in.', !!row.isActive) : '') +
    '</form>';
  openModal({
    title: row ? 'Edit ' + row.username : 'Create user',
    description: row ? 'Change role, contact details or access.' : (isApi() ? 'Credentials are hashed before they are stored.' : 'Local mode stores this password in your browser only.'),
    body,
    footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-save>' + (row ? 'Save changes' : 'Create user') + '</button>',
    onMount: (scrim, close) => {
      const form = scrim.querySelector('#uForm');
      const pw = form.querySelector('[name=password]');
      if (pw) pw.oninput = () => { scrim.querySelector('#upw').innerHTML = pwChecklist(pw.value); };
      scrim.querySelector('[data-save]').onclick = async (e) => {
        const v = readForm(form);
        const errs = {};
        if (!row) {
          if (!/^[a-zA-Z0-9._-]{3,32}$/.test(v.username || '')) errs.username = '3–32 characters: letters, numbers, dot, underscore, hyphen';
          if (!pwStrong(v.password || '')) errs.password = 'Password does not meet the policy';
        }
        if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) errs.email = 'Enter a valid email';
        if (!showErrors(form, errs)) return;
        e.target.disabled = true;
        try {
          await Data.saveUser({ username: v.username, password: v.password, role: v.role,
            email: v.email.trim() || null, fullName: v.fullName.trim() || null,
            mustChangePassword: !!v.mustChangePassword, isActive: row ? !!v.isActive : true }, row && row.id);
          close(); toast(row ? 'User updated' : 'User created'); render();
        } catch (err) { e.target.disabled = false; toast('Could not save user', err.message, 'error'); }
      };
    },
  });
}
function resetPwModal(row) {
  openModal({
    title: 'Reset password — ' + row.username, size: 'sm',
    body: '<form id="rForm" style="display:flex;flex-direction:column;gap:14px">' +
      field('password', 'New password', { type: 'password', required: true, autocomplete: 'new-password' }) +
      '<div id="rpw">' + pwChecklist('') + '</div>' +
      toggleRow('mustChange', 'Force change at next sign-in', null, true) + '</form>',
    footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-save>Reset password</button>',
    onMount: (scrim, close) => {
      const form = scrim.querySelector('#rForm');
      const pw = form.querySelector('[name=password]');
      pw.oninput = () => { scrim.querySelector('#rpw').innerHTML = pwChecklist(pw.value); };
      scrim.querySelector('[data-save]').onclick = async (e) => {
        const v = readForm(form);
        if (!showErrors(form, pwStrong(v.password) ? {} : { password: 'Password does not meet the policy' })) return;
        e.target.disabled = true;
        try {
          await Data.resetUserPassword(row.id, v.password, !!v.mustChange);
          close(); toast('Password reset', row.username + ' will use the new password at next sign-in.');
        } catch (err) { e.target.disabled = false; toast('Could not reset password', err.message, 'error'); }
      };
    },
  });
}

          '<p class="xs mut" style="margin-top:2px">Min 8 characters with an uppercase letter, a number and a symbol.</p></div>' +
          '<button class="btn btn-sec" data-changepw>Change</button></div>' +
        '<div class="row" style="gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px solid rgb(var(--line));border-radius:12px;background:rgb(var(--elev)/.5)">' +
          '<span style="color:rgb(var(--accent));flex:0 0 auto;margin-top:1px">' + icon('timer', 16) + '</span>' +
          '<div><p class="sm" style="font-weight:500">Automatic sign-out</p>' +
          '<p class="xs mut" style="margin-top:2px">This session ends after 30 minutes of inactivity' + (isApi() ? ', and tokens expire after 24 hours.' : '.') + '</p></div></div>' +
        '<div class="row" style="gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px solid rgb(' + (isApi() ? 'var(--pos)' : 'var(--warn)') + '/.3);border-radius:12px;background:rgb(' + (isApi() ? 'var(--pos)' : 'var(--warn)') + '/.07)">' +
          '<span style="color:rgb(' + (isApi() ? 'var(--pos)' : 'var(--warn)') + ');flex:0 0 auto;margin-top:1px">' + icon('db', 16) + '</span>' +
          '<div class="grow"><p class="sm" style="font-weight:500">Storage</p>' +
          '<p class="xs mut" style="margin-top:2px">' + (isApi()
            ? 'Connected to <b>' + esc(State.apiBase) + '</b> — every change is written to PostgreSQL.'
            : 'Browser-local only. Nothing is saved to a database and clearing site data wipes it.') + '</p></div>' +
          '<button class="btn btn-sec btn-sm" data-connect>' + (isApi() ? 'Change' : 'Connect') + '</button></div>') +

      card('Appearance', 'Dark is the default',
        '<div class="grid g-2">' + ['dark', 'light'].map((m) =>
          '<button data-theme="' + m + '" style="display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px;border-radius:12px;cursor:pointer;font-family:inherit;color:inherit;' +
          'border:1px solid rgb(' + (theme === m ? 'var(--accent)/.6' : 'var(--line)') + ');background:' + (theme === m ? 'rgb(var(--accent)/.08)' : 'transparent') + '">' +
          '<span style="color:rgb(var(--accent))">' + icon(m === 'dark' ? 'moon' : 'sun', 19) + '</span>' +
          '<span class="sm" style="font-weight:500;text-transform:capitalize">' + m + ' mode</span>' +
          (theme === m ? '<span class="bdg b-gold">Active</span>' : '') + '</button>').join('') + '</div>') +

      (mgr ? card('Company', 'Used on exported PDF reports',
        field('cname', 'Display name', { value: (s.company && s.company.name) || '' }) + '<div style="height:14px"></div>' +
        '<div class="grid g-2">' +
          field('clegal', 'Legal name', { value: (s.company && s.company.legalName) || '' }) +
          field('cemail', 'Email', { value: (s.company && s.company.email) || '' }) + '</div><div style="height:14px"></div>' +
        field('caddr', 'Address', { value: (s.company && s.company.address) || '' }) + '<div style="height:14px"></div>' +
        '<div class="grid g-3">' +
          field('currency', 'Currency', { value: s.currency || 'USD', hint: 'ISO code, e.g. USD' }) +
          field('dailyBudget', 'Default daily budget', { type: 'number', min: 0, value: s.dailyBudget }) +
          field('grace', 'Overdue grace (days)', { type: 'number', min: 0, max: 365, value: s.overdueGraceDays }) +
        '</div>') : '') +

      (mgr ? card('Categories & payment methods', 'Shown in the expense forms',
        '<p class="xs mut" style="margin-bottom:10px;font-weight:500">Expense categories</p>' + tagEditor('categories', 'Add a category…') +
        '<div style="height:22px"></div>' +
        '<p class="xs mut" style="margin-bottom:10px;font-weight:500">Payment methods</p>' + tagEditor('paymentMethods', 'Add a payment method…')) : '') +
    '</div>' +
    (mgr ? '<div class="row" style="justify-content:flex-end;margin-top:18px;gap:9px">' +
      (SETTINGS_DRAFT ? '<button class="btn btn-ghost" data-discard>Discard changes</button>' : '') +
      '<button class="btn btn-primary" data-savesettings style="height:44px;padding:0 22px">' + icon('save', 16) + 'Save all settings</button></div>' : '') +
    (!mgr ? '' : '');

  return { html, mount: (root) => {
    root.querySelectorAll('[data-theme]').forEach((b) => (b.onclick = () => {
      document.documentElement.dataset.theme = b.dataset.theme; safeSet(LS.theme, b.dataset.theme); render();
    }));
    root.querySelector('[data-changepw]').onclick = () => changePasswordModal(false);
    root.querySelector('[data-connect]').onclick = connectModal;
    root.querySelector('[data-saveprofile]').onclick = async (e) => {
      const fullName = root.querySelector('[name=fullName]').value.trim();
      const email = root.querySelector('[name=email]').value.trim();
      e.target.disabled = true;
      try {
        if (isApi()) { const r = await apiFetch('/auth/profile', { method: 'PATCH', body: { fullName, email } }); State.user = r.user; }
        else {
          const u = DB.users.find((x) => x.id === State.user.id);
          u.fullName = fullName || null; u.email = email || null;
          State.user.fullName = u.fullName; State.user.email = u.email;
          logLocal('UPDATE', 'User', u.id, { self: true }); saveDb();
        }
        toast('Profile updated'); render();
      } catch (err) { e.target.disabled = false; toast('Could not save profile', err.message, 'error'); }
    };

    if (!mgr) return;
    const capture = () => {
      const g = (n) => { const el = root.querySelector('[name=' + n + ']'); return el ? el.value : undefined; };
      SETTINGS_DRAFT = Object.assign({}, s, {
        company: { name: g('cname'), legalName: g('clegal'), email: g('cemail'), address: g('caddr'), tagline: (s.company && s.company.tagline) || '' },
        currency: (g('currency') || 'USD').toUpperCase(),
        dailyBudget: Number(g('dailyBudget') || 0),
        overdueGraceDays: Number(g('grace') || 0),
      });
    };
    root.querySelectorAll('[name=cname],[name=clegal],[name=cemail],[name=caddr],[name=currency],[name=dailyBudget],[name=grace]')
      .forEach((el) => (el.onchange = capture));

    root.querySelectorAll('[data-addtag]').forEach((b) => (b.onclick = () => {
      const key = b.dataset.addtag;
      const input = root.querySelector('[data-newtag="' + key + '"]');
      const v = input.value.trim();
      if (!v) return;
      capture();
      const list = (SETTINGS_DRAFT[key] || []).slice();
      if (!list.some((x) => x.toLowerCase() === v.toLowerCase())) list.push(v);
      SETTINGS_DRAFT[key] = list;
      render();
    }));
    root.querySelectorAll('[data-newtag]').forEach((el) => (el.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); root.querySelector('[data-addtag="' + el.dataset.newtag + '"]').click(); }
    }));
    root.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => {
      const [key, val] = b.dataset.rm.split('|');
      capture();
      SETTINGS_DRAFT[key] = (SETTINGS_DRAFT[key] || []).filter((x) => x !== val);
      render();
    }));
    const discard = root.querySelector('[data-discard]');
    if (discard) discard.onclick = () => { SETTINGS_DRAFT = null; render(); };
    root.querySelector('[data-savesettings]').onclick = async (e) => {
      capture();
      e.target.disabled = true;
      try {
        const saved = await Data.saveSettings({
          company: SETTINGS_DRAFT.company, currency: SETTINGS_DRAFT.currency,
          dailyBudget: SETTINGS_DRAFT.dailyBudget, overdueGraceDays: SETTINGS_DRAFT.overdueGraceDays,
          categories: SETTINGS_DRAFT.categories, paymentMethods: SETTINGS_DRAFT.paymentMethods,
        });
        CURRENCY = (saved && saved.currency) || SETTINGS_DRAFT.currency;
        SETTINGS_DRAFT = null;
        toast('Settings saved'); render();
      } catch (err) { e.target.disabled = false; toast('Could not save settings', err.message, 'error'); }
    };
  } };
}

/* ===========================================================================
   12. Boot
   =========================================================================== */
(async function boot() {
  const storedTheme = safeGet(LS.theme);
  document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark';

  loadDb();
  try {
    const user = await restoreSession();
    if (user) startIdleTimer();
  } catch { /* fall through to the login screen */ }

  if (!location.hash) location.hash = '#/';
  await render();

  window.addEventListener('error', (e) => {
    console.error('[voxpact]', e.error || e.message);
  });
})();
</script>
</body>
</html>
