version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: voxpact-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxpact
      POSTGRES_PASSWORD: voxpact_local_pw
      POSTGRES_DB: voxpact_financials
    ports:
      - "5432:5432"
    volumes:
      - voxpact_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxpact -d voxpact_financials"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  voxpact_pgdata:
